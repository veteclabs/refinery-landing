<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Refinery AI 에이전트 재생 데모</title>

<style>
*, *::before, *::after { box-sizing: border-box; }

:root {
  --sans: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
          "Apple SD Gothic Neo", "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
  --mono: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
  --ease-out: cubic-bezier(.22, 1, .36, 1);
  --ease-spring: cubic-bezier(.3, 1.12, .35, 1);
  --spot-r: 10px;
}

.stage {
  --brand: #76A6D7;
  --brand-600: #5A8FC5;
  --brand-700: #3F76AE;
  --brand-50: rgba(118,166,215,.13);
  --brand-100: rgba(118,166,215,.20);
  --ink-900: #F6F8FA;
  --ink-800: #C0C4CA;
  --ink-700: #959CA5;
  --ink-600: #878E97;
  --ink-500: #757C85;
  --ink-400: #424850;
  --ink-300: #32373F;
  --ink-200: #272B32;
  --ink-100: #1E2228;
  --ink-50: #17191E;
  --white: #191D22;
  --card: #1A1D23;
  --bg: #131519;
  --good: #3FB255;
  --good-50: rgba(63,178,85,.12);
  --warn: #F0A93A;
  --warn-50: rgba(240,169,58,.14);
  --bad: #E5484D;
  --bad-50: rgba(229,72,77,.12);

  --scrim: rgba(21, 27, 35, .44);
  --cap-bg: #0E1116;
  --cap-line: rgba(255,255,255,.11);
  --cap-ink: #E8EAED;
  --cap-ink-dim: #949AA3;
  --cap-eyebrow: #6E757E;
}

.stage.is-light {
  --brand: #76A6D7;
  --brand-600: #5A8FC5;
  --brand-700: #3F76AE;
  --brand-50: #EEF4FB;
  --brand-100: #DCE8F5;
  --ink-900: #16202C;
  --ink-800: #22303F;
  --ink-700: #3A4856;
  --ink-600: #5A6776;
  --ink-500: #7E8A98;
  --ink-400: #A4ADB8;
  --ink-300: #C8CED5;
  --ink-200: #E3E7EC;
  --ink-100: #EFF2F5;
  --ink-50: #F6F8FA;
  --white: #FFFFFF;
  --card: #FFFFFF;
  --bg: #FAFBFC;
  --good-50: rgba(63,178,85,.10);
  --warn-50: rgba(240,169,58,.12);
  --bad-50: rgba(229,72,77,.10);

  --scrim: rgba(21, 27, 35, .32);
  --cap-bg: #FFFFFF;
  --cap-line: rgba(22,32,44,.12);
  --cap-ink: #16202C;
  --cap-ink-dim: #5A6776;
  --cap-eyebrow: #8B95A1;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--sans);
  background: #E9ECEF;
  overflow: hidden;
}

.stagewrap { position: fixed; inset: 0; overflow: hidden; }
.stage {
  position: absolute; left: 50%; top: 50%;
  width: 1320px; height: 840px;
  transform: translate(-50%, -50%) scale(var(--k, 1));
  transform-origin: center center;
  /* 둥글기를 두지 않는다 — 이 화면은 산업 AI 히어로의 칸 안에 꽉 차게 들어가고,
     그 칸이 제 둥글기(왼쪽 두 모서리)를 갖는다. 여기서 또 둥글리면 모서리가
     두 겹으로 보인다. */
  border-radius: 0;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink-900);
  /* 한글은 기본값이 음절 단위로 끊겨 "에/이전트" 처럼 갈라진다. 어절 단위로 끊고,
     끊을 곳이 없는 긴 토큰만 예외로 넘긴다. */
  word-break: keep-all;
  overflow-wrap: break-word;
  box-shadow: 0 40px 90px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.06);
}
.stage.is-light { box-shadow: 0 30px 70px rgba(20,30,45,.18), 0 0 0 1px rgba(20,30,45,.08); }

.app {
  position: absolute; inset: 0;
  display: flex;
  background:
    radial-gradient(90% 46% at 50% 0%, rgba(118,166,215,.055) 0%, transparent 62%),
    var(--white);
}
.app::before {
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0;
  background: radial-gradient(70% 40% at 78% 8%, rgba(118,166,215,.10) 0%, transparent 60%);
  transition: opacity .8s ease;
}
.app[data-state="running"]::before { opacity: 1; animation: ambient 5.5s ease-in-out infinite; }
.app[data-state="await"]::before {
  opacity: 1; animation: none;
  background: radial-gradient(70% 40% at 78% 8%, rgba(240,169,58,.10) 0%, transparent 60%);
}
@keyframes ambient { 0%,100% { opacity: .5; } 50% { opacity: 1; } }

/* 사이드바는 앱 실측값이다 — 240px 흰 면에 오른쪽 테 한 줄. */
.rail {
  flex: none; width: 240px; min-height: 0;
  display: flex; flex-direction: column;
  border-right: 1px solid var(--ink-200);
  background: var(--white);
}
.stage:not(.is-light) .rail { border-right-color: var(--ink-200); }
.rail-top { display: flex; align-items: center; gap: 8px; padding: 12px 10px 8px; flex: none; }
.newbtn {
  flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 33px; padding: 7px 10px; border-radius: 8px; border: 0; cursor: pointer;
  font-family: inherit; font-size: 12.5px; font-weight: 600; color: #FFFFFF;
  background: linear-gradient(135deg, var(--brand), var(--brand-700));
  box-shadow: 0 2px 8px rgba(29,46,82,.2), inset 0 1px 0 rgba(255,255,255,.18);
}
.newbtn svg { color: #FFF; }
.iconbtn {
  width: 28px; height: 28px; flex: none; display: inline-flex; align-items: center; justify-content: center;
  border: 0; border-radius: 7px; background: transparent; color: var(--ink-500); cursor: pointer;
}
.views { display: flex; flex-direction: column; gap: 1px; padding: 4px 8px 10px; flex: none; }
/* 앱 실측 — 32px 높이 · R7 · 여백 0 8 · 사이 10 · 14px. 글자색은 한 단 옅은
   #3A4856 이고, 지금 항목만 옅은 면(#EFF2F5)에 먹색 600 으로 선다.
   ⚠️ 왼쪽 세로 막대와 파란 글씨는 앱에 없다 — 걷는다. */
.view {
  display: flex; align-items: center; gap: 10px;
  font-family: inherit; font-size: 14px; font-weight: 500; color: var(--ink-700);
  background: transparent; border: 0; border-radius: 7px; min-height: 32px; padding: 0 8px;
  cursor: pointer; text-align: left; transition: background .14s ease, color .14s ease;
}
.view > svg { color: currentColor; flex: none; }
.view.is-active { background: var(--ink-100); color: var(--ink-900); font-weight: 600; }
.searchbar { padding: 0 10px 8px; flex: none; }
.search {
  display: flex; align-items: center; gap: 8px;
  border: 1px solid var(--ink-200); border-radius: 8px;
  min-height: 34px; padding: 0 10px;
  background: var(--ink-50); color: var(--ink-500); font-size: 14px;
}
.raillabel {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 11.5px; font-weight: 600; letter-spacing: .92px;
  color: var(--ink-500); padding: 8px 18px 4px;
}
.raillabel svg { color: var(--ink-500); flex: none; }
.sessions { padding: 0 10px; display: flex; flex-direction: column; gap: 1px; }
/* 앱 실측 — 32px 한 줄 · R8 · 여백 8 38 8 11(오른쪽 38 은 호버 메뉴 자리). */
.session {
  display: flex; align-items: center; gap: 8px; width: 100%;
  border: 0; background: transparent; border-radius: 8px;
  min-height: 32px; padding: 8px 38px 8px 11px;
  font-family: inherit; text-align: left; cursor: pointer;
}
/* 접힌 대화 수를 알리는 점선 단추. 앱 실측 — R8 · 점선 1px · 11px · 여백 6 8. */
.sessmore {
  margin-top: 4px; width: 100%; padding: 6px 8px;
  font-family: inherit; font-size: 11px; color: var(--ink-400);
  background: transparent; border: 1px dashed var(--ink-200); border-radius: 8px;
  cursor: pointer;
}
.session.is-active { background: var(--ink-100); box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.stage.is-light .session.is-active { box-shadow: 0 1px 2px rgba(20,30,45,.06); }
.dot { width: 6px; height: 6px; border-radius: 50%; flex: none; background: var(--ink-300); }
.dot.is-running { background: var(--brand); animation: pulse 1.4s ease-in-out infinite; }
.dot.is-await { background: var(--warn); }
.dot.is-done { background: var(--good); }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
.session-main { min-width: 0; flex: 1; }
.session-title {
  display: block; font-size: 12.5px; font-weight: 500; color: var(--ink-800);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.session.is-active .session-title { color: var(--ink-900); font-weight: 600; }
/* 앱 목록은 제목 한 줄뿐이다. 시간·분류는 글만 남기고 화면에서 뺀다.
   ⚠️ 이 규칙이 .session 묶음보다 뒤에 있어야 한다 — 앞에 두면 여기가 덮는다. */
.session-when { display: none; font-size: 10.5px; color: var(--ink-500); margin-top: 1px; }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
/* 앱 상단 바 — 실측 56px · 면 #FAFBFC · 아래 테 1px #E3E7EC · 좌우 여백 24px. */
.topbar {
  flex: none; display: flex; align-items: center; justify-content: space-between;
  min-height: 56px; background: #FAFBFC; border-bottom: 1px solid var(--ink-200);
}
.stage:not(.is-light) .topbar { background: var(--ink-50); }
.topbar-left { display: flex; align-items: center; gap: 8px; padding: 0 24px; min-width: 0; }
.topbar-mark { width: 18px; height: 18px; display: block; flex: none; }
.topbar-title { font-size: 14px; font-weight: 600; color: var(--ink-900); white-space: nowrap; }
.topbar-actions { display: flex; align-items: center; gap: 6px; padding: 0 24px; }
.topbar-ic {
  width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center;
  color: var(--ink-900); flex: none;
}
.topbar-ic.is-dim { color: var(--ink-600); }
/* 조직 칩 — 앱 실측 42px · R8 · 흰 면 · 테 1px · 안여백 4 · 사이 6.
   아바타는 둥근 사각이 아니라 32px 원이고, 브랜드색이 아니라 옅은 회색 면이다. */
.topbar-org {
  display: inline-flex; align-items: center; gap: 6px; height: 42px; padding: 4px;
  background: var(--white); border: 1px solid var(--ink-200); border-radius: 8px;
  white-space: nowrap;
}
.topbar-av {
  width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; flex: none;
  font-size: 14px; font-weight: 600; color: var(--ink-700);
  background: var(--ink-100); border: 1px solid var(--ink-200);
}
.topbar-org-text { display: inline-flex; align-items: center; gap: 5px; min-width: 0; }
.topbar-org-name { font-size: 14px; font-weight: 600; color: var(--ink-900); }
.topbar-org-sep { font-size: 12.5px; color: var(--ink-400); }
.topbar-org-proj { font-size: 12.5px; font-weight: 500; color: var(--ink-500); }
.topbar-org svg { color: var(--ink-400); flex: none; }

.chatbar {
  flex: none; display: flex; align-items: center; gap: 10px;
  padding: 7px 16px; border-bottom: 1px solid var(--ink-100);
  background: color-mix(in srgb, var(--white) 70%, transparent);
}
.stage:not(.is-light) .chatbar { border-bottom-color: var(--ink-200); }
.chat-title {
  font-size: 12.5px; font-weight: 600; color: var(--ink-900);
  max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.chat-status { font-size: 11.5px; color: var(--ink-500); min-height: 18px; display: flex; align-items: center; }
.chat-live { display: inline-flex; align-items: center; gap: 6px; color: var(--brand); font-weight: 600; }
.stage.is-light .chat-live { color: var(--brand-700); }
.live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--brand); animation: pulse 1.4s ease-in-out infinite; }
.chat-await { color: var(--warn); font-weight: 600; }
.chat-done { color: var(--good); font-weight: 600; }
.bar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.density-btn {
  font-family: inherit; font-size: 11px; font-weight: 500; color: var(--ink-500);
  background: transparent; border: 0; border-radius: 6px; padding: 3px 9px; cursor: pointer;
}
.density-btn.is-active { color: var(--ink-900); background: var(--ink-200); font-weight: 600; }
.stage.is-light .density-btn.is-active { background: var(--white); box-shadow: 0 1px 4px rgba(20,30,45,.1); }

.canvas { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin; }
.canvas::-webkit-scrollbar { width: 8px; }
.canvas::-webkit-scrollbar-thumb { background: var(--ink-300); border-radius: 4px; }
/* 앱 실측 — 글 칸은 칸 폭에서 좌우 19px 씩 뺀 것이고, 넓어지면 736px 에서 멈춘다
   (입력창 최대폭과 같은 값이다). 사이 10px. */
.thread { max-width: 736px; margin: 0 auto; padding: 16px 19px 28px; display: flex; flex-direction: column; gap: 10px; }

/* 여는 화면은 앱(app.refinery.kr/ai-agent)의 홈과 같은 구성이다 — 마크 · 제목 ·
   한 줄 설명이 가운데에 서고, 그 아래 입력 카드, 그 아래 제안 카드가 온다.
   폭 574px 은 앱 실측값이다. */
.empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 100%; padding: 0 31px; text-align: center;
}
/* 앱의 마크는 원이 아니라 모서리 17px 짜리 둥근 사각이고, 그라데이션이 먹색까지
   내려간다. 그림자도 브랜드색 번짐에 흰 안쪽 선 한 줄이 얹힌다. */
.orb {
  width: 57px; height: 57px; border-radius: 17px; display: grid; place-items: center;
  color: #FFF; background: linear-gradient(135deg, #76A6D7, #1D2E52);
  box-shadow: 0 13.8px 34.2px rgba(118,166,215,.38),
              inset 0 1px 0 rgba(255,255,255,.25);
  margin-bottom: 12px;
  animation: breathe 3.4s ease-in-out infinite;
}
@keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
.empty-title { font-size: 21px; font-weight: 700; color: var(--ink-900); margin: 0 0 4px; letter-spacing: -.01em; }
.empty-sub { font-size: 13px; line-height: 1.55; color: var(--ink-500); margin: 0 0 18px; max-width: 800px; }
/* 수치는 브랜드색이다 — 앱 실측 13px/600 #3F76AE(--brand-700). 먹색이 아니다. */
.empty-sub b { font-weight: 600; color: var(--brand-700); }
/* 앱은 카드를 넷 두고 폭이 되면 두 열로 깐다(실측 — 카드 288 · 사이 9). */
.empty-cards {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
  gap: 9px; width: 100%; max-width: 800px;
}
.empty-card {
  display: flex; align-items: center; gap: 11px; text-align: left;
  font-family: inherit; color: var(--ink-800);
  border: 1px solid var(--ink-200); border-radius: 12px; background: var(--ink-50);
  padding: 13px 14px; cursor: pointer;
}
.empty-card-body { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
/* 설명은 한 줄로 둔다 — 칸을 넓혀 두었으므로 접히지 않는다. */
.empty-card-desc {
  font-size: 12px; line-height: 1.45; color: var(--ink-500);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.empty-card-title > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* 아이콘은 맨몸이 아니라 옅은 브랜드색 타일 안에 든다. */
.empty-card-ic {
  flex: none; width: 34px; height: 34px; border-radius: 8px;
  display: grid; place-items: center;
  background: var(--brand-100); color: var(--brand-700);
}
.empty-card-title {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 13px; font-weight: 600; color: var(--ink-900);
}
.empty-card-title svg { color: var(--ink-400); flex: none; }
/* 비어 있는 동안 입력 카드가 이 안으로 들어온다 — 바닥 띠가 아니라 흐름의 한 칸이
   되므로 위 테와 면, 바깥 여백을 걷는다. */
.empty > .composer {
  width: 100%; max-width: 800px;
  border-top: 0; background: none; padding: 0; margin: 0 0 14px;
  /* 가운데 정렬은 마크 · 제목 · 한 줄 설명까지다. 입력 카드와 제안 카드 안은
     앱처럼 왼쪽에서 시작한다. */
  text-align: left;
}
.empty-cards { text-align: left; }

.row { display: flex; }
.row--user { justify-content: flex-end; }
.user-bubble {
  max-width: 82%; font-size: 13.5px; line-height: 1.55; color: #FFFFFF;
  background: linear-gradient(135deg, var(--brand), var(--brand-700));
  border-radius: 15px 15px 4px 15px; padding: 9px 14px;
  box-shadow: 0 4px 14px rgba(29,46,82,.18);
  animation: userin .3s var(--ease-spring) both;
}
@keyframes userin { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: none; } }

.text { font-size: 13.5px; line-height: 1.65; color: var(--ink-800); max-width: 74ch; }
.text strong { color: var(--ink-900); font-weight: 650; }
.word { animation: wordin .28s var(--ease-out) both; }
@keyframes wordin { from { opacity: 0; filter: blur(4px); } to { opacity: 1; filter: none; } }

.think { border-left: 2px solid var(--ink-200); padding-left: 11px; }
.think.is-live { border-left-color: var(--brand-100); }
.fold-head {
  display: flex; align-items: center; gap: 7px; width: 100%;
  font-family: inherit; font-size: 12px; font-weight: 500; color: var(--ink-500);
  background: transparent; border: 0; padding: 3px 0; cursor: pointer;
}
.caret { transition: transform .18s var(--ease-out); color: var(--ink-400); }
.caret.is-open { transform: rotate(90deg); }
.fold { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s var(--ease-out); }
.fold.is-open { grid-template-rows: 1fr; }
.fold-clip { overflow: hidden; min-height: 0; }
.think-body { font-size: 12px; line-height: 1.6; color: var(--ink-500); padding: 4px 0 6px; }

.tools {
  /* 앱 실측 — 테는 한 단 옅은 #EFF2F5(--ink-100)이고 면은 비치지 않는 흰색이다. */
  border: 1px solid var(--ink-100); border-radius: 12px;
  background: var(--white);
  padding: 7px 11px; animation: itemin .3s var(--ease-out) both;
  transition: border-color .2s ease;
}
.tools.is-live { border-color: var(--brand-100); }
@keyframes itemin { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
.tools-ic { display: flex; color: var(--ink-400); }
.tools.is-live .tools-ic { color: var(--brand); }
.tools-label { font-size: 12px; font-weight: 500; }
.tools-count { margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--ink-400); font-variant-numeric: tabular-nums; }
.tools-list { display: flex; flex-direction: column; gap: 2px; padding: 6px 0 3px; }
.tool {
  display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap;
  font-size: 11.5px; padding: 1.5px 0; animation: itemin .22s var(--ease-out) both;
}
.tool-ic { display: flex; align-self: center; color: var(--good); flex: none; }
/* 생각 줄 — 빈 원에 옅은 글. 도구 줄과 같은 목록 안에 선다. */
.tool.is-think { align-items: flex-start; }
.tool.is-think .tool-ic { align-self: flex-start; color: var(--ink-300); margin-top: 2px; }
.tool-think { flex: 1; min-width: 0; line-height: 1.45; color: var(--ink-500); }
.tool.is-running .tool-ic { color: var(--brand); }
.tool-name { font-weight: 500; color: var(--ink-700); flex: none; }
.tool-args { color: var(--ink-400); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 46%; }
.tool-sum { color: var(--ink-600); flex-basis: 100%; padding-left: 19px; }
.verified {
  display: inline-flex; align-items: center; gap: 3px; flex: none;
  font-size: 9.5px; font-weight: 700; color: var(--good);
  background: var(--good-50); border-radius: 999px; padding: 1px 7px;
  animation: pop .3s var(--ease-spring) both;
}
@keyframes pop { from { opacity: 0; transform: scale(.8); } to { opacity: 1; transform: none; } }
.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.plan {
  border: 1px solid var(--ink-200); border-radius: 13px;
  background: linear-gradient(180deg, var(--ink-100), transparent 75%);
  padding: 11px 14px; animation: itemin .32s var(--ease-out) both;
}
.stage.is-light .plan {
  border-color: var(--brand-100);
  background: linear-gradient(180deg, var(--brand-50), color-mix(in srgb, var(--white) 40%, transparent) 70%);
}
.plan-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.plan-ring { width: 20px; height: 20px; transform: rotate(-90deg); flex: none; }
.plan-ring-bg { fill: none; stroke: var(--ink-300); stroke-width: 2.5; }
.plan-ring-fg { fill: none; stroke: var(--brand); stroke-width: 2.5; stroke-linecap: round; transition: stroke-dashoffset .6s var(--ease-out); }
.plan-title { font-size: 12.5px; font-weight: 700; color: var(--ink-900); }
.plan-count { font-family: var(--mono); font-size: 11px; color: var(--ink-500); font-variant-numeric: tabular-nums; }
.plan-steps { display: flex; flex-direction: column; gap: 2px; }
.plan-step { display: flex; align-items: center; gap: 9px; font-size: 12.5px; padding: 3.5px 0; }
.plan-step-ic { display: flex; width: 16px; justify-content: center; color: var(--ink-300); flex: none; }
.plan-step-title { color: var(--ink-500); transition: color .25s ease; }
.plan-step.is-in_progress .plan-step-title { color: var(--ink-900); font-weight: 600; }
.plan-step.is-completed .plan-step-title { color: var(--ink-600); }
.plan-spin { color: var(--brand); }
.check { width: 15px; height: 15px; }
.check-circle { fill: var(--good-50); stroke: var(--good); stroke-width: 1.4; }
.check-mark {
  fill: none; stroke: var(--good); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  stroke-dasharray: 1; animation: draw .45s var(--ease-out) both;
}
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }

.artifact {
  width: 100%; border: 1px solid var(--ink-200); border-radius: 12px;
  background: var(--card); overflow: hidden;
  box-shadow: 0 3px 14px rgba(0,0,0,.14);
  animation: itemin .34s var(--ease-out) both;
}
.stage.is-light .artifact { border-color: var(--ink-100); box-shadow: 0 3px 14px rgba(20,30,45,.05); }
.artifact-head { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-bottom: 1px solid var(--ink-200); }
.stage.is-light .artifact-head { border-bottom-color: var(--ink-100); }
.artifact-ic {
  width: 24px; height: 24px; border-radius: 8px; flex: none; display: grid; place-items: center;
  color: var(--brand); background: var(--ink-100);
}
.stage.is-light .artifact-ic { color: var(--brand-700); background: var(--brand-50); }
.artifact-title { flex: 1; min-width: 0; font-size: 12.5px; font-weight: 600; color: var(--ink-900); }
.artifact-meta { font-size: 10.5px; color: var(--ink-400); flex: none; }
.artifact-body { padding: 10px 12px; }
.chart { width: 100%; height: auto; display: block; }
.chart-line { fill: none; stroke: var(--brand); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 1; animation: draw .9s var(--ease-out) both; }
.chart-area { fill: color-mix(in srgb, var(--brand) 12%, transparent); }
.chart-dot { fill: var(--brand); }
.chart-dot.is-anomaly { fill: var(--bad); }
.chart-th { stroke: var(--warn); stroke-width: 1; stroke-dasharray: 4 4; }
.chart-thlabel { font-size: 9px; fill: var(--warn); font-family: var(--mono); }
.chart-grid { stroke: var(--ink-200); stroke-width: 1; }
.chart-ax { font-size: 9px; fill: var(--ink-500); font-family: var(--mono); }
.mtable { width: 100%; border-collapse: collapse; font-size: 12px; }
.mtable th {
  text-align: left; font-size: 10.5px; font-weight: 600; color: var(--ink-500);
  padding: 4px 8px; border-bottom: 1px solid var(--ink-200); white-space: nowrap;
}
.mtable td { padding: 5.5px 8px; color: var(--ink-800); border-bottom: 1px solid var(--ink-100); }
.mtable tr:last-child td { border-bottom: 0; }
.mtable td.is-num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.pill { display: inline-flex; align-items: center; font-size: 10.5px; font-weight: 600; padding: 1px 7px; border-radius: 999px; }
.pill.is-bad { color: var(--bad); background: var(--bad-50); }
.pill.is-warn { color: var(--warn); background: var(--warn-50); }

.approval {
  border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent);
  border-radius: 14px; background: var(--warn-50); overflow: hidden;
  animation: slideup .3s var(--ease-out) both;
  transition: border-color .35s ease, background .35s ease;
}
@keyframes slideup { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.approval.is-resolved { border-color: var(--ink-200); background: color-mix(in srgb, var(--white) 50%, transparent); }
.approval-head {
  display: flex; align-items: center; gap: 8px; padding: 10px 13px;
  font-size: 12.5px; font-weight: 600; color: var(--warn);
  border-bottom: 1px solid color-mix(in srgb, var(--warn) 20%, transparent);
  transition: color .35s ease, border-color .35s ease;
}
.approval.is-resolved .approval-head { color: var(--ink-500); border-bottom-color: var(--ink-200); }
.approval-tier {
  margin-left: auto; font-size: 10px; font-weight: 700; letter-spacing: .03em;
  padding: 1.5px 8px; border-radius: 999px; background: var(--warn); color: #FFFFFF;
  transition: background .35s ease; white-space: nowrap;
}
.approval.is-resolved .approval-tier { background: var(--ink-300); }
.approval-item { display: flex; align-items: flex-start; gap: 12px; padding: 11px 13px; transition: opacity .3s ease; }
.approval-item + .approval-item { border-top: 1px dashed color-mix(in srgb, var(--warn) 22%, transparent); }
.approval.is-resolved .approval-item + .approval-item { border-top-color: var(--ink-200); }
.approval-item.is-denied { opacity: .62; }
.approval-item-main { flex: 1; min-width: 0; }
.approval-item-title { font-size: 13px; font-weight: 600; color: var(--ink-900); }
.approval-params { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 5px; font-size: 12px; color: var(--ink-800); }
.approval-k { color: var(--ink-500); margin-right: 6px; }
.approval-impact { margin-top: 5px; font-size: 11.5px; color: var(--ink-500); }
.approval-actions { display: flex; gap: 6px; flex: none; align-items: center; }
.btn {
  font-family: inherit; font-size: 12px; font-weight: 600; border-radius: 8px;
  padding: 5px 13px; cursor: pointer; border: 1px solid transparent; white-space: nowrap;
  transition: transform .14s ease, filter .14s ease;
}
.btn--primary { color: #FFFFFF; background: var(--brand-700); border-color: var(--brand-700); }
.btn--ghost { color: var(--ink-600); background: var(--ink-100); border-color: var(--ink-200); }
.btn.is-press { transform: scale(.93); filter: brightness(1.15); }
.decision { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; white-space: nowrap; animation: pop .3s var(--ease-spring) both; }
.decision.is-allowed { color: var(--good); }
.decision.is-denied { color: var(--ink-500); }

.turnend { padding-top: 2px; animation: itemin .4s var(--ease-out) both; }
.turnend-meta { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--ink-400); font-variant-numeric: tabular-nums; }
.turnend-meta svg { color: var(--brand); }
.dotsep { width: 3px; height: 3px; border-radius: 50%; background: var(--ink-300); display: inline-block; }
.followups { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.followup {
  display: inline-flex; align-items: center; gap: 6px; font-family: inherit;
  font-size: 12px; color: var(--ink-600); background: transparent;
  border: 1px solid var(--ink-200); border-radius: 999px; padding: 5px 12px; cursor: pointer;
  animation: itemin .4s var(--ease-out) both;
}
.followup svg { color: var(--brand); flex: none; }

/* 앱 실측 — 입력창 위에 구분선도 면도 없다. 여백만 2px 16px 16px. */
.composer {
  flex: none; border-top: 0; background: none;
  padding: 2px 16px 16px;
}
/* 앱의 입력 카드. 글줄이 위, 도구줄이 아래로 한 상자 안에 든다(실측 — R12,
   안여백 11/11/9/13, 사이 7, 그림자 0 8px 28px rgba(20,30,45,.07)). */
/* 대화 중 입력부. 앱은 홈과 값이 다르다 — 모서리가 16 으로 커지고 안여백이
   줄며 그림자가 두 겹이 된다(실측). 홈 값은 아래 .empty .input 에서 되돌린다. */
.input {
  display: flex; flex-direction: column; gap: 6px;
  /* 앱 실측 — 최대폭 736px. 글 칸과 같은 값이라 둘의 좌우 선이 맞는다. */
  max-width: 736px; margin: 0 auto;
  border: 1px solid var(--ink-200); border-radius: 16px;
  background: var(--card); padding: 8px 8px 8px 10px;
  box-shadow: 0 1px 2px rgba(20,30,45,.06), 0 8px 24px rgba(20,30,45,.10);
}
.empty .input {
  max-width: 800px; gap: 7px; border-radius: 12px; padding: 11px 11px 9px 13px;
  box-shadow: 0 8px 28px rgba(20,30,45,.07);
}
.input-ph {
  font-size: 13.5px; line-height: 1.5; color: var(--ink-400);
  padding: 3px 2px; min-height: 26px;
  /* ⚠️ 여는 화면(.empty)이 가운데 정렬이라 글줄이 가운데로 선다. 앱은 왼쪽이다. */
  text-align: left;
}
.ctools { display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 30px; }
.empty .ctools { height: 32px; }
.ctools-l, .ctools-r { display: flex; align-items: center; gap: 6px; min-width: 0; }
/* 모델 이름과 '자문'은 여는 화면에도 대화 중에도 똑같이 선다 — 앱이 그렇다.
   ⚠️ 창이 좁으면 접혀서 안 보인다. 좁은 창을 보고 '대화 중에만 있다'고 잘못
      읽어 홈에서 숨겼던 적이 있다. */
.modelname, .advisor {
  display: inline-flex; align-items: center; height: 28px; padding: 0 8px;
  border-radius: 8px; font-size: 12px; white-space: nowrap;
}
/* 앱 실측 — 13px/400 먹색, 사이 8, 여백 0 7. 앞 표식은 13px 옅은 회색. */
.modelname { gap: 8px; padding: 0 7px; font-size: 13px; color: var(--ink-800); max-width: 180px; overflow: hidden; }
.modelname svg { flex: none; }
.modelname svg:first-child { color: var(--ink-500); }
.advisor { gap: 5px; font-weight: 500; color: var(--ink-500); }
.advisor svg { flex: none; }

/* 권한 고르는 판. 흐름에서 떠 있어 열려도 아래가 밀리지 않는다. */
.modewrap { position: relative; display: inline-flex; }
.modemenu {
  position: absolute; top: calc(100% + 6px); left: 0; z-index: 30;
  width: 238px; padding: 6px;
  background: var(--card); border: 1px solid var(--ink-200); border-radius: 12px;
  box-shadow: 0 1px 2px rgba(20,30,45,.06), 0 12px 32px rgba(20,30,45,.14);
  opacity: 0; transform: translateY(-4px); pointer-events: none;
  transition: opacity .14s ease, transform .14s ease;
}
.modemenu.is-on { opacity: 1; transform: none; }
.modeopt {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 9px; border-radius: 9px;
}
.modeopt.is-on { background: var(--brand-50); }
.modeopt-ic {
  flex: none; width: 26px; height: 26px; border-radius: 7px;
  display: grid; place-items: center; background: var(--ink-50); color: var(--ink-500);
}
.modeopt.is-on .modeopt-ic { background: var(--brand-100); color: var(--brand-700); }
.modeopt-t { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.modeopt-n { font-size: 12.5px; font-weight: 600; color: var(--ink-900); }
.modeopt.is-on .modeopt-n { color: var(--brand-700); }
.modeopt-d { font-size: 11px; line-height: 1.35; color: var(--ink-500); }
.modeopt-ck { margin-left: auto; color: var(--brand-700); flex: none; }
.modemenu-foot {
  margin: 4px 0 0; padding: 7px 9px 3px; font-size: 11px; line-height: 1.4;
  color: var(--ink-400); border-top: 1px solid var(--ink-100);
}
.attach-btn {
  flex: none; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
  border: 0; background: transparent; color: var(--ink-500);
}
/* 권한을 정하는 단추 하나. 앱에서 Plan·Auto·Manual 칩 줄과 '모델 선택' 알약이
   여기로 합쳐졌다 — 테도 면도 없고 글자만 선다(실측 — R8, 13px, 여백 0 7px). */
.modelpick {
  display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 7px;
  font-family: inherit; font-size: 13px; font-weight: 400; color: var(--ink-800);
  background: transparent; border: 1px solid transparent; border-radius: 8px;
  cursor: pointer; white-space: nowrap;
}
/* ⚠️ 앞 아이콘은 브랜드색이 아니다 — 앱은 글자와 같은 계열의 옅은 회색(#7E8A98)이다. */
.modelpick svg { color: var(--ink-500); flex: none; }
/* 캐럿은 글자색을 따르되 한 겹 옅게 둔다(앱은 opacity .7).
   ⚠️ '.modelpick svg' 와 자릿수가 같으면 그쪽이 이겨 회색이 된다 — 한 단 길게 쓴다. */
.modelpick .caret-ic, .modelname .caret-ic { color: currentColor; opacity: .7; flex: none; }
.mode-hint {
  font-size: 12px; color: var(--ink-400);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
}
.send {
  flex: none; width: 30px; height: 30px; border-radius: 8px; border: 0; display: grid; place-items: center;
  color: #FFFFFF; background: linear-gradient(135deg, var(--brand), var(--brand-700));
}
.empty .send { width: 32px; height: 32px; }
.send.is-busy { background: var(--ink-300); }

.side-sec { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-500); }

/* 온톨로지 맵 산출물. 타입 노드와 관계. 이번 작업이 실제로 탄 경로만 브랜드색으로 살린다. */
.omap { width: 100%; height: auto; display: block; }
.omap-edge { stroke: var(--ink-300); stroke-width: 1.2; }
.omap-edge.is-path { stroke: var(--brand); stroke-width: 2; }
.omap-box { fill: var(--card); stroke: var(--ink-200); stroke-width: 1; }
.omap-box.is-path { stroke: var(--brand); }
.omap-name { font-size: 11px; font-weight: 600; fill: var(--ink-900); }
.omap-count { font-size: 9.5px; fill: var(--ink-500); font-family: var(--mono); }
.omap-legend { display: flex; gap: 12px; margin-top: 6px; font-size: 10.5px; color: var(--ink-500); }
.omap-legend i { display: inline-block; width: 14px; height: 2px; border-radius: 2px; vertical-align: 3px; margin-right: 5px; }

/* 절감 리포트 산출물 */
.report-hero { display: flex; align-items: baseline; gap: 8px; margin-bottom: 9px; }
.report-num { font-size: 24px; font-weight: 700; color: var(--good); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.report-unit { font-size: 12px; color: var(--ink-500); }
.report-rows { display: flex; flex-direction: column; gap: 5px; }
.report-row { display: flex; align-items: baseline; font-size: 12px; gap: 10px; }
.report-k { color: var(--ink-500); flex: 1; min-width: 0; }
.report-v { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--ink-900); font-weight: 600; }
.report-v.is-cut { color: var(--good); }


/* 강조 영역 둘레를 네 판으로 덮는다. clip-path 로 구멍을 뚫으면 배경색은 잘리지만
   backdrop-filter 는 잘리지 않아 흐림이 구멍 안까지 새어 든다(무대에 transform 이
   걸린 상태에서 실측 확인). 판의 경계가 곧 흐림의 경계여야 강조 영역이 선명하게 남는다.
   네 판만으로는 모서리가 각지므로, 모서리에는 흐림 없이 색만 입힌 패치를 덧대
   테두리와 같은 반경을 낸다. 위치는 트랜지션하지 않아 제자리에서 나타나고,
   사라질 때는 아주 빠르게 뺀다. */
.scrim, .scrim-b {
  position: absolute; pointer-events: none; z-index: 39;
  opacity: 0;
  transition: opacity .3s ease;
}
/* 어둡게 까는 층. 색은 clip-path 로 잘리므로 한 장이면 되고, 모서리도 테두리와 같은 반경으로 둥글다. */
.scrim { inset: 0; background: var(--scrim); }
/* 흐리는 층. backdrop-filter 는 clip-path 로 잘리지 않아 강조 영역까지 번지므로,
   판의 경계 자체를 흐림의 경계로 삼는다. 색이 없어 판 사이 이음새가 드러나지 않는다. */
.scrim-b {
  backdrop-filter: blur(1px);
  -webkit-backdrop-filter: blur(1px);
}
.scrim.is-on, .scrim-b.is-on { opacity: 1; }
.scrim:not(.is-on), .scrim-b:not(.is-on) { transition: opacity .11s ease; }

.spot {
  position: absolute; pointer-events: none;
  /* 모서리는 JS 가 대상에서 읽어 네 귀를 그대로 박는다. 아래는 예비값. */
  border-radius: var(--spot-r);
  /* 선도 띠도 .spot 자체의 바깥 그림자로 긋는다. 이유가 둘 있다.
     1) 그림자는 번짐만큼 모서리 반지름을 같이 키워 대상과 동심을 이룬다.
        ::after 로 1px 밀어 두면 그 1px 만큼 모서리가 어긋난다.
     2) 크롬은 border 두께를 정수 픽셀로 내려 1px 아래로 못 간다. 그림자
        번짐은 소수값이 그대로 살아 나중에 더 얇게 가져갈 여지가 남는다.
     하늘색 선은 inset 으로 안쪽에 그어 대상이 가진 테와 같은 1px 자리에 얹는다.
     바깥으로 빼면 대상 테와 나란히 두 줄이 된다. 띠는 대상 바깥 변에서 시작한다.
     둘 다 자리를 차지하지 않아 강조 영역의 크기는 대상 그대로이고,
     spot(z-index 40)이 딤(39) 위에 있어 바깥이 어두워져도 색이 그대로 선다. */
  box-shadow: inset 0 0 0 1px #76A6D7, 0 0 0 8px #EEF4FB;
  opacity: 0;
  transition: opacity .3s ease;
  z-index: 40;
}
.spot:not(.is-on) { transition: opacity .11s ease; }
.spot.is-on { opacity: 1; }

.cap {
  position: absolute; z-index: 50; width: 348px;
  background: var(--cap-bg); border: 1px solid var(--cap-line); border-radius: 13px;
  padding: 15px 17px 16px;
  box-shadow: 0 24px 60px rgba(0,0,0,.45);
  opacity: 0; transform: translateY(6px);
  transition: opacity .3s ease, transform .3s var(--ease-out);
  pointer-events: none;
}
.cap:not(.is-on) { transition: opacity .11s ease; }
.stage.is-light .cap { box-shadow: 0 24px 60px rgba(20,30,45,.22); }
.cap.is-on { opacity: 1; transform: none; }
.cap-eyebrow {
  display: flex; align-items: center; gap: 7px;
  font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: .16em;
  text-transform: uppercase; color: var(--cap-eyebrow); margin-bottom: 8px;
}

  let startAt = 0;

  function wait(ms) {
    if (startAt > 0) return Promise.resolve();
    const my = epoch;
    return new Promise((resolve, reject) => {
      let remain = ms, last = performance.now();
      const tick = (now) => {
        if (my !== epoch) return reject(ABORT);
        if (paused) { last = now; return requestAnimationFrame(tick); }
        const dt = now - last; last = now;
        remain -= dt * SPEED;
        if (remain <= 0) return resolve();
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    });
  }

  let DWELL = 1;

  /* 설명 카드 체류. 실시간(1배)으로 흐른다 — 재생 배속(SPEED)을 곱하지 않는다. */

    if (startAt > 0) return Promise.resolve();
    const my = epoch;
    return new Promise((resolve, reject) => {
      let remain = ms * DWELL, last = performance.now();
      const tick = (now) => {

        if (paused) { last = now; return requestAnimationFrame(tick); }
        const dt = now - last; last = now;

        requestAnimationFrame(tick);
      };

  /* ─────────────────────────── 상태 ─────────────────────────── */
  let elapsed = 0, elapsedTimer = null;
  function setPhase(phase) {
    app.dataset.state = phase === "running" ? "running" : phase === "await" ? "await" : "idle";
    const s = $("chatStatus"), dot = $("activeDot");
    dot.className = "dot " + (phase === "running" ? "is-running" : phase === "await" ? "is-await" : phase === "done" ? "is-done" : "");
    if (phase === "running") {
      s.innerHTML = '<span class="chat-live"><span class="live-dot"></span><span>' + T.stWorking + ' · <span id="elapsed">' + elapsed + '</span>s</span></span>';
    } else if (phase === "await") {
      s.innerHTML = '<span class="chat-await">' + T.stAwait + '</span>';
    } else if (phase === "done") {
      s.innerHTML = '<span class="chat-done">' + T.stDone + '</span>';
    } else { s.innerHTML = ""; }
    $("sendBtn").classList.toggle("is-busy", phase === "running");
  }
  /* 경과 초는 시나리오와 같은 배속으로 흐른다. 실시간으로 두면 3배 재생에서 헤더는 13초를
     세는데 턴 푸터는 47초라고 적어, 화면 안에서 두 숫자가 어긋난다. */
  function startClock() {
    stopClock();
    elapsedTimer = setInterval(() => {
      if (paused) return;   /* 일시정지 중에는 경과 초도 멈춘다 */
      elapsed += 1;
      const e = $("elapsed"); if (e) e.textContent = elapsed;
    }, 1000 / SPEED);
  }
  function stopClock() { if (elapsedTimer) clearInterval(elapsedTimer); elapsedTimer = null; }

  /* ─────────────────────────── 블록 ─────────────────────────── */
  function addUser(text) {
    $("empty").style.display = "none";
    thread.style.display = "";
    composerHome.appendChild($("composer"));
    $("chatTitle").style.display = "";
    $("chatTitle").textContent = T.chatTitle;
    $("activeSessionTitle").textContent = T.s0t;
    $("activeSessionWhen").textContent = T.s0wActive;
    $("activeSessionTitle").closest(".session").classList.add("is-active");
    const row = el("div", "row row--user");
    row.appendChild(el("div", "user-bubble", text));
    thread.appendChild(row); follow();
  }

     안에 섞어 내므로, 실행 묶음의 줄 하나로 들어간다. 동그라미는 빈 원이고,
     도구 줄은 채워진다. */

    await wait(ms);

  const R = 8, C = 2 * Math.PI * R;

    const done = steps.filter((s) => s.st === "completed").length;

    return '<div class="plan-head">' +
      '<svg viewBox="0 0 22 22" class="plan-ring"><circle cx="11" cy="11" r="' + R + '" class="plan-ring-bg"/>' +
      '<circle cx="11" cy="11" r="' + R + '" class="plan-ring-fg" stroke-dasharray="' + C + '" stroke-dashoffset="' + (C * (1 - pct)) + '"/></svg>' +
      '<span class="plan-title">' + T.planLabel + '</span><span class="plan-count">' + done + '/' + steps.length + '</span></div>' +
      '<div class="plan-steps">' + steps.map((s) =>
        '<div class="plan-step is-' + s.st + '"><span class="plan-step-ic">' +

  function chartSVG(vals, thIdx, thVal) {
    const w = 660, h = 168, pad = 20;
    // 임계값을 축 범위에 포함시킨다. 데이터 최대보다 큰 임계선이 플롯 밖으로 밀려나던 문제.
    const lo = Math.min(...vals, thVal), hi = Math.max(...vals, thVal);
    const pad10 = (hi - lo) * 0.12 || 1;
    const min = lo - pad10, max = hi + pad10, span = (max - min) || 1;
    const pts = vals.map((v, i) => [
      pad + (i / (vals.length - 1)) * (w - pad * 2),
      h - pad - ((v - min) / span) * (h - pad * 2)
    ]);
    const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
    const area = line + " L" + pts[pts.length - 1][0].toFixed(1) + " " + (h - pad) + " L" + pad + " " + (h - pad) + " Z";
    const thY = h - pad - ((thVal - min) / span) * (h - pad * 2);
    const grid = [0.25, 0.5, 0.75].map((f) => {
      const y = pad + f * (h - pad * 2);
      return '<line class="chart-grid" x1="' + pad + '" y1="' + y + '" x2="' + (w - pad) + '" y2="' + y + '"/>';
    }).join("");
    const dots = pts.map((p, i) =>
      '<circle class="chart-dot' + (i >= thIdx ? " is-anomaly" : "") + '" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="' + (i >= thIdx ? 3.6 : 2.2) + '"/>').join("");
    const labels = pts.map((p, i) =>
      '<text class="chart-ax" x="' + p[0].toFixed(1) + '" y="' + (h - 5) + '" text-anchor="middle">' + T.chartX[i] + '</text>').join("");
    return '<svg class="chart" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="' + T.chartTitle + '">' +
      grid + '<path class="chart-area" d="' + area + '"/><path class="chart-line" d="' + line + '" pathLength="1"/>' +
      '<line class="chart-th" x1="' + pad + '" y1="' + thY.toFixed(1) + '" x2="' + (w - pad) + '" y2="' + thY.toFixed(1) + '"/>' +
      '<text class="chart-thlabel" x="' + (w - pad) + '" y="' + (thY - 5).toFixed(1) + '" text-anchor="end">' + T.chartTh + '</text>' +
      dots + labels + '</svg>';
  }

  const OMAP_EDGES = [[0, 2, 1], [0, 1, 0], [2, 3, 1], [3, 4, 1], [3, 5, 1], [5, 6, 1], [5, 7, 0]];

      '" width="' + W + '" height="' + H + '" rx="9"/>' +
      '<text class="omap-name" x="' + d[2] + '" y="' + (d[3] - 1) + '" text-anchor="middle">' + d[0] + '</text>' +
      '<text class="omap-count" x="' + d[2] + '" y="' + (d[3] + 12) + '" text-anchor="middle">' + d[1] + '</text></g>').join("");
    return '<svg class="omap" viewBox="0 0 660 200" role="img" aria-label="' + T.omapTitle + '">' +
      edges + boxes + '</svg>' +
      '<div class="omap-legend"><span><i style="background:var(--brand)"></i>' + T.omapPath + '</span>' +

  /* ─────────────────────── 스포트라이트 ─────────────────────── */
  /* 강조 테는 대상 요소에 딱 맞춘다(PAD 0). 여백을 주면 테와 카드 사이가 비어
     무엇을 가리키는지 흐려진다. 모서리는 rectOf 가 대상에서 읽어 온다. */
  const PAD = 0;
  function rectOf(sel) {
    /* 여럿을 받으면 그 사각형들의 합집합을 돌려준다 — 단추와 그 아래 열린 판처럼
       따로 떨어진 둘을 한 번에 강조할 때 쓴다. */
    if (Array.isArray(sel)) {
      const rs = sel.map(rectOf).filter(Boolean);
      if (!rs.length) return null;
      const L = Math.min.apply(null, rs.map((r) => r.x));
      const T = Math.min.apply(null, rs.map((r) => r.y));
      const R = Math.max.apply(null, rs.map((r) => r.x + r.w));
      const B = Math.max.apply(null, rs.map((r) => r.y + r.h));
      return { x: L, y: T, w: R - L, h: B - T, r: rs[0].r, radCss: rs[0].radCss };
    }
    // 선택자 또는 요소. 같은 클래스의 산출물이 여럿이라 선택자로는 특정할 수 없다.
    const node = typeof sel === "string" ? document.querySelector(sel) : sel;
    if (!node) return null;
    const sr = stage.getBoundingClientRect(), r = node.getBoundingClientRect();
    // 모서리는 대상이 가진 값을 그대로 가져온다. 고정값을 박으면 둥글기가 다른
    // 대상에서 테와 카드의 모서리가 어긋나 떠 보인다.
    const cs = getComputedStyle(node);
    let rad = parseFloat(cs.borderTopLeftRadius) || 0;
    let radCss = cs.borderRadius;
    let box = r;
    /* 제 모양이 없는 껍데기(배경·테·모서리가 모두 없는 것)는 그 자신이 아니라
       안에 든 것들의 합집합에 맞춘다. #sessions 는 좌우 패딩 10px 때문에 줄보다
       9px 씩 넓게 서고, 그만큼 테가 줄 밖으로 뜬다. 모서리도 안의 것을 따른다 —
       #modes 는 줄이 0px 인데 칩이 999px 알약이라, 각진 사각형으로 서면
       왼쪽·오른쪽 끝이 칩과 어긋난다. */
    const bare = !rad && cs.borderTopWidth === "0px" && cs.backgroundImage === "none" &&
                 (cs.backgroundColor === "rgba(0, 0, 0, 0)" || cs.backgroundColor === "transparent");
    if (bare && node.children.length) {
      let L = Infinity, T = Infinity, R2 = -Infinity, B = -Infinity, kid = 0, n = 0;
      for (let i = 0; i < node.children.length; i++) {
        const k = node.children[i], kr = k.getBoundingClientRect();
        if (!kr.width || !kr.height) continue;
        n++;
        L = Math.min(L, kr.left); T = Math.min(T, kr.top);
        R2 = Math.max(R2, kr.right); B = Math.max(B, kr.bottom);
        kid = Math.max(kid, parseFloat(getComputedStyle(k).borderTopLeftRadius) || 0);
      }
      if (n) {
        box = { left: L, top: T, width: R2 - L, height: B - T };
        rad = Math.min(kid, box.width / K / 2, box.height / K / 2);
        radCss = rad + "px";
      }
    }
    /* 네 변을 디바이스 픽셀에 맞춘다. 대상의 제 테두리는 크롬이 디바이스 픽셀로
       반올림해 그리는데 강조 테는 소수 좌표 그대로 그려져, 변마다 어긋나는 정도가
       달랐다(위 변은 .82 라 가려지고 아래 변은 .4 라 회색이 0.4px 비쳤다).
       화면 좌표에서 맞춘 뒤 무대 좌표로 되돌리므로 다시 칠해질 때 같은 자리에 선다. */
    const d = window.devicePixelRatio || 1;
    const snap = function (v) { return Math.round(v * d) / d; };
    const L2 = snap(box.left), T2 = snap(box.top);
    const R3 = snap(box.left + box.width), B2 = snap(box.top + box.height);
    const w = (R3 - L2) / K, h = (B2 - T2) / K;
    return { x: (L2 - sr.left) / K, y: (T2 - sr.top) / K, w: w, h: h,
             r: rad, radCss: radCss };
  }
  /* 부모 창이 설명 카드를 자기 화면에 직접 그리는 모드. 켜지면 데모 안의 카드는
     숨기고, 강조 범위와 카드 내용을 부모에 넘긴다. 산업 AI 페이지가 쓴다. */
  let extCap = false;

  function placeCap(box) {
    const CW = 348, GAP = 22, M = 22;
    const ch = cap.offsetHeight || 168;
    let left, top;
    if (box.x + box.w + GAP + CW + M <= STAGE_W) left = box.x + box.w + GAP;
    else if (box.x - GAP - CW >= M) left = box.x - GAP - CW;
    else left = Math.min(Math.max(box.x, M), STAGE_W - CW - M);
    if (left >= box.x + box.w || left + CW <= box.x) {
      top = Math.min(Math.max(box.y + box.h / 2 - ch / 2, M), STAGE_H - ch - M);
    } else {
      top = box.y + box.h + GAP;
      if (top + ch + M > STAGE_H) top = Math.max(box.y - GAP - ch, M);
    }
    cap.style.left = left + "px";
    cap.style.top = top + "px";
  }
  /** 대상 사각형을 무대 가장자리 안으로 잘라 강조 범위를 낸다. */
  function boxOf(raw) {
    const M = 9;
    const x1 = Math.max(raw.x - PAD, M), y1 = Math.max(raw.y - PAD, M);
    const x2 = Math.min(raw.x + raw.w + PAD, STAGE_W - M);
    const y2 = Math.min(raw.y + raw.h + PAD, STAGE_H - M);
    return { x: x1, y: y1, w: x2 - x1, h: y2 - y1 };
  }
  /** 테와 딤 구멍을 한 자리에 놓는다. */
  function layoutSpot(box, raw) {
    const R = raw.r != null ? raw.r : SPOT_R;
    // 네 귀가 다를 수 있으므로 단축값을 통째로 박는다. 딤 구멍은 숫자 하나만 받는다.
    spot.style.borderRadius = raw.radCss || R + "px";
    place(spot, box.x, box.y, box.w, box.h);
    const x2 = box.x + box.w, y2 = box.y + box.h;
    const p = "path(evenodd, '" + holePath(box.x, box.y, box.w, box.h, R) + "')";
    scrim.style.clipPath = p;
    scrim.style.webkitClipPath = p;
    place(blurT, 0, 0, STAGE_W, box.y);
    place(blurB, 0, y2, STAGE_W, STAGE_H - y2);
    place(blurL, 0, box.y, box.x, box.h);
    place(blurR, x2, box.y, STAGE_W - x2, box.h);
  }
  function showSpot(sel, num, kicker, title, body) {
    const raw = rectOf(sel);
    if (!raw) return;
    const box = boxOf(raw);
    layoutSpot(box, raw);
    spot.classList.add("is-on");
    veil.forEach((n) => n.classList.add("is-on"));
    $("capNum").textContent = String(num).padStart(2, "0");
    $("capKicker").textContent = kicker;
    $("capTitle").textContent = title;
    $("capBody").innerHTML = body;
    if (extCap) {
      emitFocus(box, { num: num, kicker: kicker, title: title, body: body });
      return;
    }
    cap.classList.add("is-on");
    placeCap(box);
    emitFocus(box, null);
  }
  function hideSpot() {
    spot.classList.remove("is-on");
    veil.forEach((n) => n.classList.remove("is-on"));
    cap.classList.remove("is-on");
    emitFocus(null, null);
  }

  /* 지금 어디를 강조 중인지 부모 창에 알린다(무대 1320x840 좌표).
     화면을 그쪽으로 당겨서 보여주려는 페이지가 쓴다 — 산업 AI 페이지가 그렇다.
     랜딩은 이 메시지를 듣지 않으므로 지금 모습 그대로다.
     데모 안에 카드를 띄우는 동안에는 카드까지 합친 범위를 보낸다 — 강조 상자만
     보내면 카드가 화면 밖으로 밀린다. 카드를 부모가 그리는 모드(extCap)에서는
     상자만 보낸다. 카드를 합치면 범위가 넓어져 확대가 거의 되지 않는다. */
  function emitFocus(box, text) {
    if (parent === window) return;
    let payload = null;
    if (box) {
      payload = { x: box.x, y: box.y, w: box.w, h: box.h };
      if (!extCap) {
        const cl = parseFloat(cap.style.left) || 0;
        const ct = parseFloat(cap.style.top) || 0;
        const cw = cap.offsetWidth || 348, ch = cap.offsetHeight || 168;
        const x1 = Math.min(box.x, cl), y1 = Math.min(box.y, ct);
        const x2 = Math.max(box.x + box.w, cl + cw), y2 = Math.max(box.y + box.h, ct + ch);
        payload = { x: x1, y: y1, w: x2 - x1, h: y2 - y1 };
      }
    }
    try { parent.postMessage({ type: "refinery-hero-focus", box: payload, cap: text || null }, "*"); } catch (e) {}
  }

  /* 장면이 머무는 동안 진행률을 알린다(0 -> 1). 멈춰 있으면 멈춘다 —
     부모가 이 값으로 구간 막대를 채운다. */
  function dwellP(i, ms) {
    if (startAt > 0) return Promise.resolve();
    const my = epoch;
    const tell = (p) => {
      if (parent === window) return;
      try { parent.postMessage({ type: "refinery-hero-progress", i: i, p: p }, "*"); } catch (e) {}
    };
    return new Promise((resolve, reject) => {
      const total = ms * DWELL;
      let remain = total, last = performance.now(), acc = 0;
      tell(0);
      const tick = (now) => {
        if (my !== epoch) return reject(ABORT);
        if (paused) { last = now; return requestAnimationFrame(tick); }
        const dt = now - last; last = now;
        remain -= dt; acc += dt;
        /* 60ms 마다만 알린다 — 매 프레임 보내면 메시지가 과하다. */
        if (acc >= 60) { acc = 0; tell(Math.max(0, Math.min(1, 1 - remain / total))); }
        if (remain <= 0) { tell(1); return resolve(); }
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    });
  }

  function closeModeMenu() {
    try { $("modeMenu").classList.remove("is-on"); } catch (err) {}
  }

  async function chapter(i, sel) {
    /* 건너뛰는 중이면 목적지 앞 장면은 그리지 않고 지나간다. */
    if (startAt > 0) {
      if (i < startAt) return;
      startAt = 0;
    }
    await wait(reduce ? 60 : 260);
    const c = T.chapters[i];
    showSpot(sel, i + 1, c[0], c[1], c[2]);
    if (parent !== window) {
      try { parent.postMessage({ type: "refinery-hero-chapter", i: i, total: T.chapters.length }, "*"); } catch (e) {}
    }
    const chars = c[2].replace(/<[^>]+>/g, "").length + c[1].length;
    await dwellP(i, Math.min(Math.max(1100 + chars * 17, 1900), 3800));
    hideSpot();
    await wait(reduce ? 60 : 320);
  }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("is-on");
    setTimeout(() => toastEl.classList.remove("is-on"), 1500);
  }

  /* ─────────────────────────── 시나리오 ─────────────────────────── */
  function resetStage() {
    stopClock(); elapsed = 0; planNode = null;
    thread.innerHTML = ""; thread.style.display = "none";
    $("empty").style.display = "";
    /* 앱 홈은 입력창이 제안 카드 위에 있다. 비어 있는 동안만 그 자리로 옮기고,
       대화가 시작되면 제자리(바닥)로 돌려놓는다. */
    $("empty").insertBefore($("composer"), $("emptyCards"));
    $("modeMenu").classList.remove("is-on");
    $("chatTitle").style.display = "none";
    /* 쉬는 모습에서도 줄 이름은 이번 대화의 제목이다. 다만 아직 고르지 않은
       상태이므로 칠하지 않는다 — 대화가 시작될 때 비로소 골라진다. */
    $("activeSessionTitle").textContent = T.s0t;
    $("activeSessionWhen").textContent = T.s0w;
    $("activeSessionTitle").closest(".session").classList.remove("is-active");
    $("chatView").style.display = "flex";
    $("inputPh").textContent = T.phIdle;
    $("endcard").classList.remove("is-on");
    document.querySelectorAll("#views .view").forEach((v, k) => v.classList.toggle("is-active", k === 0));
    setPhase("idle");
    hideSpot();
  }

  async function run() {
    resetStage();

    /* 01 통제 — 권한 판을 열어 두고 단추와 판을 함께 강조한다. */
    $("modeMenu").classList.add("is-on");
    await chapter(0, ["#modes", "#modeMenu"]);
    $("modeMenu").classList.remove("is-on");

    $("inputPh").textContent = T.prompt;
    await wait(700);
    addUser(T.prompt);
    $("inputPh").textContent = T.phFollow;
    setPhase("running"); startClock();
    await wait(420);

    /* 묶음을 먼저 연다 — 생각한 내용이 그 안의 줄로 들어간다. */
    const g1 = addTools();
    const th = addThinkRow(g1);
    await think(th, T.think[0], 460);
    await think(th, T.think[1], 500);
    await think(th, T.think[2], 480);
    thinkDone();
    await wait(240);

    setPlan(["in_progress", "pending", "pending", "pending"]);
    await wait(380);

    /* 전수 탐색 + 제약 교차검증 */
    const delays = [620, 900, 820, 980];
    for (let i = 0; i < T.steps.length; i++) {
      const s = T.steps[i];
      const row = toolStart(g1, s[0], s[1]);
      await wait(delays[i]);
      toolEnd(g1, row, s[2], i === T.steps.length - 1);
      if (i < T.steps.length - 1) await wait(190);
    }
    toolsDone(g1);
    await wait(300);

    /* 02 규모 */
    await chapter(1, ".tools");

    setPlan(["completed", "in_progress", "pending", "pending"]);
    await wait(280);
    await addText(T.text1);
    await wait(240);

    addArtifact("chart", T.chartTitle, "v1", chartSVG([3180, 3260, 3210, 3420, 3640, 4010, 4180], 6, 4200));
    await wait(620);

    /* 온톨로지 맵. 관계를 읽는다는 증거 */
    const mapArt = addArtifact("map", T.omapTitle, "v1", omapSVG());
    await wait(660);

    /* 03 맥락 */
    await chapter(2, mapArt);

    setPlan(["completed", "completed", "in_progress", "pending"]);
    await wait(280);
    addArtifact("table", T.tableTitle, "v1", tableHTML(T.tableRows));
    await wait(700);

    /* 사용자 수정 요청 → 재작성 */
    addUser(T.revise);
    await wait(420);
    const g2 = addTools();
    const r2 = toolStart(g2, T.step2[0], T.step2[1]);
    await wait(860);
    toolEnd(g2, r2, T.step2[2], true);
    toolsDone(g2);
    await wait(260);
    const tableV2 = addArtifact("table", T.tableTitle2, "v2", tableHTML(T.tableRows2));
    await wait(680);

    /* 04 수정 */
    await chapter(3, tableV2);

    setPlan(["completed", "completed", "completed", "in_progress"]);
    await wait(300);
    await addText(T.text2);
    await wait(280);

    const card = addApproval();
    setPhase("await"); stopClock();
    await wait(520);

    /* 05 승인 */
    await chapter(4, ".approval");

    await decide(card, "a0", true);
    await wait(440);
    await decide(card, "a1", true);
    await wait(440);
    await decide(card, "a2", false);
    card.classList.add("is-resolved");
    await wait(380);
    toast(T.toastDecided);

    setPhase("running"); startClock();
    await wait(300);

    const g3 = addTools();
    const r3 = toolStart(g3, T.step3[0], T.step3[1]);
    await wait(840);
    toolEnd(g3, r3, T.step3[2]);
    toolsDone(g3);
    await wait(260);

    /* 절감 리포트 */
    const reportArt = addArtifact("doc", T.reportTitle, "v1", reportHTML());
    await wait(640);

    /* 06 산출물 */
    await chapter(5, reportArt);

    await addText(T.text3);
    await wait(240);
    setPlan(["completed", "completed", "completed", "completed"]);
    await wait(360);

    setPhase("done"); stopClock();
    addTurnEnd();
    await wait(520);

    /* 07 확장 */
    await chapter(6, "#sessions");

    await wait(500);
    if (extCap) {
      /* 설명을 바깥에서 그리는 페이지(산업 AI)에서는 마무리 카드가 무대 아래쪽
         (y758~)에 떠서 화면 밖이다. 보이지도 않는 카드를 기다리느라 마지막
         장면이 5초 넘게 멈춰 있었다. 짧게 넘기고 다음 바퀴로 간다.
         wait()는 재생 배속(이 페이지 2배)으로 나뉜다. 앞의 wait(500)와 합쳐
         실제 2초가 되도록 3500을 준다. */
      await wait(3500);
    } else {
      $("endcard").classList.add("is-on");
      await dwell(3600);
      $("endcard").classList.remove("is-on");
      await wait(700);
    }
    start(); // 무한 반복
  }

  function start() {
    epoch += 1;
    scenarioStarted = true;
    $("endcard").classList.remove("is-on");
    /* 한 바퀴가 새로 시작한다고 부모에 알린다. 시작 화면에서 잠깐 멈췄다가
       가는 페이지가 매 바퀴 같은 연출을 하려면 이 시점을 알아야 한다. */
    if (parent !== window) {
      try { parent.postMessage({ type: "refinery-hero-cycle" }, "*"); } catch (e) {}
    }
    run().catch((e) => { if (e !== ABORT) throw e; });
  }

  /* 랜딩 히어로에서 오는 조작. 같은 출처의 iframe이라 postMessage로 주고받는다.
     refinery-hero-replay는 예전부터 랜딩이 보내고 있었는데 받는 쪽이 없어
     스크롤로 되돌아와도 다시 재생되지 않았다. 여기서 함께 살린다. */
  window.addEventListener("message", (e) => {
    const t = e.data && e.data.type;
    if (t === "refinery-hero-extcap") {
      extCap = true; cap.style.display = "none";
      /* 설명을 바깥에서 그리는 페이지는 구간 막대에 장면 이름을 붙인다 —
         이름은 언어마다 다르므로 여기서 목록을 넘긴다. */
      try { e.source && e.source.postMessage({ type: "refinery-hero-chapters", names: T.chapters.map(function (c) { return c[0]; }) }, "*"); } catch (err) {}
      return;
    }
    /* 재생 배속. 부모가 페이지마다 다르게 잡는다(기본 3, 낮을수록 느리다).
       설명 카드가 머무는 시간(dwell)은 읽는 시간이라 여기 곱해지지 않는다. */
    if (t === "refinery-hero-dwell") {
      const d = Number(e.data.value);
      if (d > 0) DWELL = Math.max(0.5, Math.min(3, d));
      return;
    }
    if (t === "refinery-hero-speed") {
      const v = Number(e.data.value);
      if (v > 0) SPEED = Math.max(0.5, Math.min(6, v));
      return;
    }
    /* ⚠️ 멈출 때 권한 판도 닫는다. 히어로의 쉬는 상태는 되감기가 아니라 이
       'pause' 로 만들어지는데, 01 장면에 닿은 뒤에 멈추면 판이 열린 채로 굳어
       기본 모습에 창이 떠 있게 된다(그 꼴이 한 번 났다). */
    if (t === "refinery-hero-pause") { paused = true; closeModeMenu(); }
    else if (t === "refinery-hero-resume") paused = false;
    else if (t === "refinery-hero-toggle") { paused = !paused; if (paused) closeModeMenu(); }
    else if (t === "refinery-hero-replay") { paused = false; start(); }
    /* 첫 화면으로 되감고 멈춘 채로 둔다. 산업 AI 페이지가 쓴다 — 카드가 작아져
       쉬는 모습으로 돌아가면 처음 그 화면에 다시 세워야 한다.
       ⚠️ replay 로는 안 된다. 그쪽은 paused 를 풀고 한 바퀴를 시작하므로,
          부모가 곧바로 pause 를 보내도 그 사이에 장면이 흘러간다.
       ⚠️ epoch 를 올려 돌던 바퀴를 끊는다(wait · dwell 이 이 값을 보고 ABORT).
          scenarioStarted 도 내려 두어야 다음에 다시 시작할 수 있다. */
    /* 막대의 칸을 눌렀을 때. 그 장면부터 다시 돈다 — 앞 장면은 기다림 없이
       지나가므로 눈에는 곧바로 건너뛴 것으로 보인다. */
    else if (t === "refinery-hero-goto") {
      startAt = Math.max(0, Number(e.data.i) || 0);
      paused = false;
      start();
    }
    else if (t === "refinery-hero-rewind") {
      paused = true;
      epoch += 1;
      startAt = 0;
      scenarioStarted = false;
      try { $("endcard").classList.remove("is-on"); } catch (err) {}
      /* ⚠️ 권한 판도 닫는다. 01 장면 도중에 되감기면 판이 열린 채로 굳어,
         쉬는 모습('묻는 것으로 시작하는 AI 에이전트')에 창이 떠 있게 된다. */
      closeModeMenu();
      applyStatic();
      setPhase("idle");
    }
    else return;
    /* 부모가 아이콘 상태를 맞출 수 있도록 결과를 돌려준다. */
    try { e.source && e.source.postMessage({ type: "refinery-hero-state", paused: paused }, "*"); } catch (err) {}
  });

  applyStatic();
  setPhase("idle");

  /* 화면에 들어왔을 때 시작한다. 브라우저는 보이지 않는 요소의 프레임을 멈추므로,
     페이지 하단에 끼워 넣고 로드 시점에 재생하면 방문자가 스크롤해 내려왔을 때
     처음이 아니라 중간부터 보게 된다. */
  const io = new IntersectionObserver((entries) => {
    if (entries.some((e) => e.isIntersecting)) {
      io.disconnect();
      /* 부모가 먼저 시작시켰으면(refinery-hero-replay) 다시 시작하지 않는다. */
      if (!scenarioStarted) start();
    }
  }, { threshold: 0.35 });
  io.observe(stage);
})();
</script>
